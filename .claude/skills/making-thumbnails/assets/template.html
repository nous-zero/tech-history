<!doctype html>
<!-- tech-history 썸네일 표준 템플릿 (1280×720)
     교체할 값: ①BG_IMAGE 경로 ②훅 문구(t1/t2 — 합쳐 4단어 이내) ③연도 뱃지
               ④인셋 이미지·캡션. 시그니처(앰버 그라데이션 t2, 증거 폴라로이드)는 유지. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { width:1280px; height:720px; overflow:hidden; font-family:'Pretendard','Malgun Gothic',sans-serif; }
  .stage { position:relative; width:1280px; height:720px; background:#000; }
  .photo {
    position:absolute; inset:0;
    background:url('BG_IMAGE.jpg') center 28%/cover no-repeat;  /* ① 배경 실사 */
    filter:contrast(1.08) brightness(.96) grayscale(.15);
  }
  .shade {
    position:absolute; inset:0;
    background:
      linear-gradient(180deg, rgba(5,8,16,.30) 0%, transparent 26%, transparent 46%, rgba(4,7,14,.86) 86%, rgba(3,5,11,.95) 100%),
      linear-gradient(100deg, rgba(4,7,14,.62) 0%, transparent 44%),
      radial-gradient(ellipse 900px 500px at 50% 30%, transparent 55%, rgba(4,7,14,.35) 100%);
  }
  .badge {
    position:absolute; left:56px; top:52px;
    font-family:Consolas,monospace; font-size:46px; font-weight:700; color:#fff;
    background:linear-gradient(180deg,#EF4444,#B91C1C); padding:6px 28px 10px; border-radius:14px;
    box-shadow:0 10px 32px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.35);
  }
  .t1 {
    position:absolute; left:60px; bottom:236px;
    font-size:76px; font-weight:900; color:#fff; letter-spacing:-2px;
    text-shadow:0 4px 14px rgba(0,0,0,.9), 0 12px 44px rgba(0,0,0,.7);
  }
  .t2 {  /* 시그니처: 앰버 그라데이션 키워드 */
    position:absolute; left:54px; bottom:64px;
    font-size:180px; font-weight:900; letter-spacing:-5px; line-height:1;
    background:linear-gradient(180deg,#FFE9A8 5%, #FFC53D 50%, #F59E0B 96%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 6px 18px rgba(0,0,0,.95)) drop-shadow(0 16px 50px rgba(0,0,0,.7));
  }
  .log {  /* 시그니처: 증거 폴라로이드 */
    position:absolute; right:54px; bottom:64px; width:300px;
    border:5px solid rgba(255,255,255,.92); border-radius:10px;
    box-shadow:0 18px 50px rgba(0,0,0,.75); transform:rotate(2.5deg); overflow:hidden;
  }
  .log img { display:block; width:100%; filter:sepia(.25) contrast(1.05); }
  .log figcaption {
    background:rgba(255,255,255,.94); color:#1F2937;
    font-size:19px; font-weight:700; text-align:center; padding:7px 4px 9px;
  }
  .log figcaption span { color:#B91C1C; }
</style>
</head>
<body>
<div class="stage">
  <div class="photo"></div>
  <div class="shade"></div>
  <div class="badge">1969</div>                       <!-- ③ 연도 -->
  <div class="t1">핵전쟁이 만든</div>                   <!-- ② 훅 윗줄 -->
  <div class="t2">인터넷</div>                          <!-- ② 앰버 키워드 -->
  <figure class="log">
    <img src="INSET_IMAGE.jpg" alt="">                <!-- ④ 실물 사료 -->
    <figcaption>실제 기록 — 첫마디는 <span>"LO"</span></figcaption>
  </figure>
</div>
</body>
</html>
